[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geofabrik-downloader"
dynamic = ["version"]
description = "Lightweight Python client for discovering and downloading OpenStreetMap extracts from Geofabrik."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Umut Ucok" }]
keywords = [
    "geofabrik",
    "openstreetmap",
    "osm",
    "pbf",
    "shapefile",
    "geopackage",
    "gis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.7",
]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
geofabrik = "geofabrik.cli:app"

[project.urls]
Homepage = "https://github.com/uucokgis/Geofabrik-Downloader"
Issues = "https://github.com/uucokgis/Geofabrik-Downloader/issues"
Source = "https://github.com/uucokgis/Geofabrik-Downloader"

[tool.hatch.version]
path = "src/geofabrik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/geofabrik"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "network: hits the real Geofabrik API (deselect with -m 'not network')",
]
